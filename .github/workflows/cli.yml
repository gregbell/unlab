name: CLI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

# This tests the CLI and never publishes it: its owner releases it by hand. See "Release the CLI" in the README.
jobs:
  # The oldest Node.js it runs on, on both systems it runs on.
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npx vitest run --project unit cli src/streams
      - run: npx vitest run --project integration test/integration/cli-link.test.ts
      - run: node cli/dist/cli.mjs --version
