name: Release the CLI

# Run by hand from the Actions tab: it publishes the version that cli/package.json on main has. npm takes it from this
# workflow alone, through trusted publishing, so no npm token is kept anywhere. See "Release the CLI" in the README.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs a newer npm than Node.js comes with.
      - run: npm install --global npm@11
      - run: npm ci
      - name: Read the version
        id: version
        run: |
          version=$(node -p "require('./cli/package.json').version")
          if npm view "unlab.run@$version" version >/dev/null 2>&1; then
            echo "unlab.run $version is published already. Raise version in cli/package.json first." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/cli-v$version" >/dev/null; then
            echo "The tag cli-v$version is there already, on another commit perhaps." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npx vitest run --project unit cli src/streams
      - run: npx vitest run --project integration test/integration/cli-link.test.ts
      - run: npm run cli
      - run: test "$(node cli/dist/cli.mjs --version)" = "${{ steps.version.outputs.version }}"
      - run: npm publish --provenance --access public
        working-directory: cli
      - name: Tag what was published
        run: |
          git tag "cli-v${{ steps.version.outputs.version }}"
          git push origin "cli-v${{ steps.version.outputs.version }}"
      - name: Say what was published
        run: |
          {
            echo "Published [unlab.run ${{ steps.version.outputs.version }}](https://www.npmjs.com/package/unlab.run/v/${{ steps.version.outputs.version }})"
            echo "from \`${GITHUB_SHA::7}\`, tagged \`cli-v${{ steps.version.outputs.version }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
